<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games — ilomoussalli-ui</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d0d; color: #e8e8e8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 3rem 1.5rem; }
    nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5rem; }
    .logo { font-size: 13px; font-weight: 500; letter-spacing: 0.08em; color: #888; }
    .nav-link { font-size: 13px; color: #555; text-decoration: none; }
    .hero { margin-bottom: 4rem; }
    .hero-label { font-size: 11px; letter-spacing: 0.15em; color: #444; margin-bottom: 1rem; text-transform: uppercase; }
    .hero h1 { font-size: clamp(36px, 6vw, 58px); font-weight: 400; line-height: 1.1; color: #e8e8e8; }
    .hero h1 em { color: #444; font-style: normal; }
    .divider { width: 100%; height: 1px; background: #1e1e1e; margin-bottom: 3rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1px; background: #1e1e1e; }
    .card { background: #0d0d0d; padding: 2rem; text-decoration: none; display: block; position: relative; overflow: hidden; transition: background 0.2s; }
    .card:hover { background: #131313; }
    .card-num { font-size: 11px; letter-spacing: 0.12em; color: #333; margin-bottom: 2rem; }
    .card-title { font-size: 22px; font-weight: 400; color: #e8e8e8; margin-bottom: 0.5rem; line-height: 1.2; }
    .card-genre { font-size: 13px; color: #444; margin-bottom: 2.5rem; }
    .card-arrow { font-size: 13px; color: #333; transition: color 0.2s; }
    .card:hover .card-arrow { color: #888; }
    .card-accent { width: 2px; height: 32px; background: #e8e8e8; position: absolute; top: 2rem; right: 2rem; opacity: 0; transition: opacity 0.2s; }
    .card:hover .card-accent { opacity: 1; }
    .card-new { background: #0d0d0d; padding: 2rem; border: 1px dashed #1e1e1e; display: flex; align-items: center; justify-content: center; min-height: 180px; }
    .card-new p { font-size: 13px; color: #2a2a2a; letter-spacing: 0.05em; }
    footer { margin-top: 4rem; padding-top: 2rem; border-top: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
    footer p { font-size: 12px; color: #333; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <span class="logo">GAMES</span>
      <a class="nav-link" href="#">ilomoussalli-ui</a>
    </nav>
    <div class="hero">
      <p class="hero-label">Browser games</p>
      <h1>Things I built<br><em>for fun.</em></h1>
    </div>
    <div class="divider"></div>
    <div class="grid">
      <a class="card" href="./Shard Rush/index.html">
        <div class="card-accent"></div>
        <p class="card-num">01</p>
        <h2 class="card-title">Shard Rush</h2>
        <p class="card-genre">Roguelike</p>
        <span class="card-arrow">Play &rarr;</span>
      </a>
      <div class="card-new">
        <p>More coming soon</p>
      </div>
    </div>
    <footer>
      <p>Built with Claude Code</p>
      <p>2025</p>
    </footer>
  </div>
</body>
</html>
